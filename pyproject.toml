[project]
name = "powerdns_api_proxy"
version = "1.0.0"
description = "PowerDNS-API-Proxy"
keywords = ["powerdns_api_proxy"]
authors = [{ name = "akquinet", email = "noc@akquinet.de" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.5",
    "fastapi==0.143.3",
    "httpx",
    "prometheus-fastapi-instrumentator==8.1.0",
    "pyyaml==6.0.3",
    "sentry-sdk[fastapi]==2.72.0",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/akquinet/powerdns-api-proxy"

[dependency-groups]
dev = [
    "mypy==1.20.2",
    "prek==0.5.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["powerdns_api_proxy", "powerdns_api_proxy.*"]

[tool.ruff]
target-version = "py311"
