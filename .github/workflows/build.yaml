---
on:
  push:
    branches:
      - "*"
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Setup
        run: make setup

      - name: Run tests
        run: make unit
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Setup
        run: make setup

      - name: Run pre-commit
        run: make pre-commit-all
        env:
          SKIP: "no-commit-to-branch"
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - test
      - pre-commit
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GHCR
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags') || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push master Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags') || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  packages:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - pre-commit
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/rockylinux:8
            format: rpm
            prepare: dnf install -y curl tar gzip findutils util-linux
            install: dnf install -y
          - image: docker.io/debian:13
            format: deb
            prepare: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
            install: apt-get install -y --no-install-recommends
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build ${{ matrix.format }} package
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            ${{ matrix.image }} \
            sh -c '${{ matrix.prepare }} && packaging/build.sh ${{ matrix.format }}'

      - name: Smoke test ${{ matrix.format }} package
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/packaging:/packaging:ro" \
            ${{ matrix.image }} \
            sh -c '${{ matrix.prepare }} && ${{ matrix.install }} /dist/*.${{ matrix.format }} && /packaging/smoke-test.sh'

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # semantic-release pushes the tag before it creates the release, so this
        # run can start first; wait for the release to appear.
        run: |
          for _ in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.${{ matrix.format }} --clobber

  semantic-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - container
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v3
        env:
          # Fine-grained PAT (contents: write). The default GITHUB_TOKEN cannot
          # be used here: tags it pushes do not trigger workflows, so the
          # release tag would never produce a semver-tagged container image.
          GITHUB_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
